<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shipping estimator</title>
<style>body{margin:0;padding:10px 12px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#2b2118} .row{display:flex;gap:8px;align-items:center} input{padding:6px;width:120px} p{margin:8px 0}</style></head>
<body>
  <div class="row">
    <label for="ship-zip">Delivery ZIP</label>
    <input id="ship-zip" type="text" inputmode="numeric" value="94110">
    <button type="button" id="estimate">Update estimate</button>
  </div>
  <p>Ground (UPS): arrives <strong>Thu, 8 Oct</strong> &mdash; $5.50</p>
  <p>2-Day Air: arrives <strong>Mon, 5 Oct</strong> &mdash; $14.00</p>
</body>
</html>
