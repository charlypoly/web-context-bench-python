  - text: / Client.request()
  - heading "Client.request()" [level=1]:
    - code: Client.request()
  - paragraph:
    - text: Send an HTTP request and return a
    - link "Response":
      - /url: "#"
      - code: Response
    - text: . This is the low-level method that all verb helpers such as
    - code: client.get()
    - text: and
    - code: client.post()
    - text: call internally.
  - button "Copy"
  - code: response = client.request( method, url, *, params=None, headers=None, json=None, data=None, timeout=DEFAULT_TIMEOUT, follow_redirects=True, max_redirects=20, retry=None, )
