<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cobalt Pay</title>
<style>body{margin:0;padding:10px 12px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#1b2a3a} label{display:block;margin:6px 0 2px} input{padding:7px;width:260px} .row{display:flex;gap:16px} button{margin-top:12px;padding:9px 18px;background:#1f4fd1;color:#fff;border:0;border-radius:4px} .brand{font-size:12px;color:#5a6b80}</style></head>
<body>
  <div class="brand">Secured by Cobalt Pay &middot; Test mode</div>
  <label for="card">Card number</label>
  <input id="card" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234">
  <div class="row">
    <div><label for="exp">Expiry (MM/YY)</label><input id="exp" type="text" autocomplete="cc-exp" style="width:110px"></div>
    <div><label for="cvc">Security code</label><input id="cvc" type="text" autocomplete="cc-csc" style="width:90px"></div>
  </div>
  <button type="button" id="pay">Pay $84.20</button>
  <p class="brand">We accept Visa, Mastercard and American Express.</p>
</body>
</html>
