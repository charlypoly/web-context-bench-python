- article:
  - text: Travel · Long read
  - heading "The Quiet Return of the Night Train" [level=1]
  - paragraph: After decades of cuts, overnight rail routes are being revived across Europe. Can sleeper carriages compete with budget flights?
  - text: By
  - link "Helena Marsh":
    - /url: "#"
  - text: · Published
  - time: 14 March 2026
  - text: · 9 min read ·
  - button "Share"
  - button "Save article"
  - paragraph: At 19:42 on a wet Tuesday, the Nordlys sleeper eases out of Hamburg Altona with 312 passengers on board. By the time most of them wake, the train will have crossed two borders and covered 1,140 kilometres to reach Stockholm Central. Five years ago the route did not exist.
  - paragraph: The revival is not confined to Scandinavia. Operators have added fourteen new overnight services since 2022, according to figures compiled by the European Rail Passengers Forum, bringing the continent's total to 47 regular routes. Most run three to seven nights a week; only a handful operate daily all year.
  - heading "Why now?" [level=2]
  - paragraph: "Part of the answer is policy. Several governments have tied airline support packages to commitments on short-haul flights, and the European Commission's 2024 rail action plan set aside €380 million for rolling stock. Part of it is demand: in a survey of 6,200 travellers carried out last autumn, 58 percent said they would choose a night train over a flight for journeys under 1,500 kilometres if the fares were comparable."
  - blockquote: "\"People do not miss the airport. They miss arriving somewhere rested, in the middle of a city, at eight in the morning.\" — Matteo Ricci, head of planning at Alpina Nachtzug"
  - paragraph: Fares remain the sticking point. A berth in a six-bed couchette on the Vienna–Brussels line starts at €69, while a private sleeper compartment for two can exceed €400 in peak season. Budget airlines frequently undercut both, although the comparison changes once airport transfers and an extra hotel night are included.
  - heading "The rolling stock problem" [level=2]
  - paragraph: New sleeper carriages are expensive and slow to build. Alpina ordered 33 seven-car trainsets in 2021; the first entered service in December 2023 and the last is not expected until 2027. In the meantime many routes still rely on refurbished carriages built in the 1980s, which lack showers and step-free access.
