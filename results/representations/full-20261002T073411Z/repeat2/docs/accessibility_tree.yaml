  - strong: "Note:"
  - text: Since version 3.0,
  - code: timeout
  - text: applies to the entire request rather than to each socket operation.
  - heading "Returns" [level=2]
  - paragraph:
    - text: A
    - code: Response
    - text: object. The body is read eagerly unless you use
    - link "Client.stream()":
      - /url: "#"
      - code: Client.stream()
    - text: .
  - heading "Raises" [level=2]
  - list:
    - listitem:
      - code: ConnectTimeout
      - text: — the connection could not be established in time.
    - listitem:
      - code: TooManyRedirects
      - text: — more than
      - code: max_redirects
      - text: redirects were followed.
    - listitem:
      - code: InvalidURL
      - text: — the URL could not be parsed.
  - strong: "Deprecated:"
  - text: The
  - code: verify_ssl
  - text: argument was removed in 3.2. Configure TLS on the
  - code: Client
  - text: instead.
  - heading "Example" [level=2]
  - button "Copy"
  - code: "from ferrite import Client, RetryPolicy with Client(base_url=\"https://api.example.com\") as client: response = client.request( \"PATCH\", \"/orders/42\", json={\"status\": \"shipped\"}, retry=RetryPolicy(attempts=3), ) response.raise_for_status()"
